<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>컬러 스트룹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 아이폰 사파리는 -webkit- 접두사를 붙여야 알아듣는다: 버튼을 누르다 글자가 파랗게 선택(블록)되거나
     길게 눌러 복사 메뉴가 뜨지 않게. 입력칸은 그대로 선택·붙여넣기 되게 둔다 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea, [contenteditable] { -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }

  /* 작은 오락실 공통 스티커 스타일: 진한 남보라 테두리 + 아래로 떨어진 그림자 + 둥근 글꼴 */
  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; --muted:#6b5c95; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:
      repeating-linear-gradient(-30deg, rgba(255,255,255,.07) 0 26px, transparent 26px 56px),
      linear-gradient(180deg, #4f8cff 0%, #6b5cff 55%, #8a4fe0 100%);
    font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:var(--ink);
    touch-action:none;
  }
  #stage { width:100%; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; }
  #hud { display:flex; align-items:center; gap:6px; padding:0 2px 8px; font-variant-numeric:tabular-nums; width:100%; position:relative; z-index:2; }
  #hud .item {
    display:flex; align-items:center; gap:5px; white-space:nowrap;
    background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink);
    padding:2px 12px; height:38px;
  }
  #hud .item.score { background:var(--yellow); flex:1; min-width:0; }
  #hud .label { font-size:11px; color:var(--muted); }
  #hud .item.score .label { color:#8a5a00; }
  #hud .value { font-size:21px; }
  #hud .icons { display:flex; gap:6px; margin-left:auto; }
  #hud button {
    background:#fff; border:3px solid var(--ink); color:var(--ink); position:relative;
    width:36px; height:36px; border-radius:12px; font-size:15px; cursor:pointer; box-shadow:0 4px 0 var(--ink);
  }
  #hud button::after { content:''; position:absolute; inset:-10px -6px; }
  #hud button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }

  #wrap { position:relative; }

  #overlay {
    position:absolute; inset:0; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:12px;
    text-align:center; padding:18px; background:rgba(43,29,82,.74); border-radius:22px;
    backdrop-filter:blur(3px); overflow-y:auto; touch-action:pan-y;
  }
  #overlay.hidden { display:none; }
  #overlay h1, #overlay h2 { color:#fff; font-weight:400; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay h1 { font-size:clamp(40px, 12vw, 54px); line-height:1.05; color:var(--yellow); }
  #overlay h2 { font-size:30px; }
  #overlay p { font-size:14px; line-height:1.55; color:#fff; }
  #overlay p b { color:var(--yellow); font-weight:400; }
  #overlay .big { font-size:48px; color:var(--yellow); font-variant-numeric:tabular-nums; line-height:1; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay .tag { display:inline-block; background:var(--pink); color:#fff; font-size:15px; padding:3px 14px; border-radius:999px; border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink); }
  #overlay .card2 {
    font-size:14px; color:var(--ink); line-height:1.7; text-align:left; background:#fff; border:3px solid var(--ink);
    border-radius:18px; box-shadow:0 5px 0 var(--ink); padding:10px 16px;
  }
  #overlay .stats { display:grid; grid-template-columns:auto auto; gap:3px 18px; font-size:16px; font-variant-numeric:tabular-nums; }
  #overlay .stats dt { color:var(--muted); text-align:right; }
  #overlay button {
    background:var(--yellow); color:var(--ink); font-size:21px; font-family:inherit; border:3px solid var(--ink);
    border-radius:999px; padding:10px 36px; box-shadow:0 5px 0 var(--ink); cursor:pointer;
  }
  #overlay button small { display:block; font-size:12px; color:var(--muted); margin-top:1px; }
  #overlay button.sub { background:#fff; font-size:16px; padding:7px 22px; box-shadow:0 4px 0 var(--ink); }
  #overlay button:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  #overlay .col { display:flex; flex-direction:column; align-items:center; gap:9px; }

  @media (max-width:420px) {
    #hud { gap:4px; }
    #hud .label { display:none; }
    #hud .item { padding:2px 10px; height:34px; box-shadow:0 3px 0 var(--ink); }
    #hud .value { font-size:17px; }
    #hud button { width:32px; height:32px; font-size:13px; box-shadow:0 3px 0 var(--ink); }
  }
  @media (max-height:700px) {
    #overlay { gap:8px; padding:12px; }
    #overlay h1 { font-size:38px; } #overlay h2 { font-size:26px; } #overlay .big { font-size:38px; }
    #overlay p, #overlay .card2 { font-size:12.5px; }
    #overlay button { font-size:18px; padding:8px 28px; }
  }

  #col { width:min(100%, 400px); max-height:100dvh; overflow-y:auto; overflow-x:hidden; padding-bottom:6px; scrollbar-width:none; }
  #col::-webkit-scrollbar { display:none; }
  #stage { align-items:flex-start; justify-content:flex-start; }
  #wrap { position:relative; width:100%; }
  #hud .item.score .value { overflow:hidden; text-overflow:ellipsis; }
  #hud .item.life { background:#fff; padding:2px 10px; }
  #hud .item.life .value { font-size:17px; letter-spacing:1px; }
  #panel { background:rgba(255,255,255,.16); border:4px solid var(--ink); border-radius:22px; box-shadow:0 6px 0 var(--ink); padding:10px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  #rule { align-self:stretch; text-align:center; font-size:17px; color:var(--ink); background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink); padding:5px 12px; transition:background .2s; }
  #rule b { font-weight:400; color:#e65b82; }
  #rule.word { background:var(--yellow); animation:pulse .5s ease 2; }
  @keyframes pulse { 50% { transform:scale(1.04); } }
  #card { position:relative; align-self:stretch; background:#fff; border:3px solid var(--ink); border-radius:20px; box-shadow:0 5px 0 var(--ink); min-height:170px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:12px 8px 14px; overflow:hidden; }
  #card.good { background:#e6ffe9; } #card.bad { background:#ffe3e3; animation:shake .3s ease; }
  @keyframes shake { 20% { transform:translateX(-6px); } 40% { transform:translateX(6px); } 60% { transform:translateX(-4px); } 80% { transform:translateX(3px); } }
  #word { font-size:clamp(60px, 22vw, 92px); line-height:1.1; font-weight:400; paint-order:stroke fill; -webkit-text-stroke:10px var(--ink); min-height:1.1em; letter-spacing:2px; }
  #tbar { align-self:stretch; height:12px; margin:0 14px; background:rgba(43,29,82,.15); border:3px solid var(--ink); border-radius:999px; overflow:hidden; }
  #tbar i { display:block; height:100%; width:100%; background:var(--pink); transform-origin:left; }
  #tbar.low i { background:#ff3b3b; }
  #combo { position:absolute; top:8px; right:12px; font-size:15px; color:var(--ink); background:var(--yellow); border:2px solid var(--ink); border-radius:999px; padding:0 10px; display:none; }
  #answers { align-self:stretch; display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; }
  #answers.c3 { grid-template-columns:repeat(3, 1fr); }
  .ans { font:inherit; font-size:20px; color:#fff; paint-order:stroke fill; -webkit-text-stroke:5px var(--ink); border:3px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--ink); height:64px; cursor:pointer; padding:0; touch-action:manipulation; position:relative; }
  .ans:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  .ans small { position:absolute; left:8px; top:3px; font-size:11px; -webkit-text-stroke:0; color:rgba(255,255,255,.9); text-shadow:0 1px 0 var(--ink); }
  .ans.right { animation:glow .6s ease 1; outline:5px solid #fff; outline-offset:-1px; }
  @keyframes glow { 0%, 100% { transform:scale(1); } 40% { transform:scale(1.07); } }
  .ans:disabled { opacity:.55; }
  #msg { min-height:34px; font-size:14px; color:#fff; text-shadow:0 2px 0 var(--ink); text-align:center; line-height:1.35; white-space:pre-line; }
  #banner { position:absolute; left:50%; top:30%; transform:translate(-50%,-50%) scale(.6); z-index:10; font-size:34px; color:#fff; paint-order:stroke fill; -webkit-text-stroke:7px var(--ink); opacity:0; pointer-events:none; transition:all .25s ease; white-space:nowrap; }
  #banner.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #overlay .stats { grid-template-columns:auto auto; }
  @media (max-height:700px) { #panel { gap:7px; padding:8px; } #card { min-height:140px; gap:7px; padding:8px 6px 10px; } .ans { height:56px; font-size:18px; } #msg { min-height:28px; font-size:13px; } }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="hud">
      <div class="item life"><span class="value" id="lives">❤️❤️❤️</span></div>
      <div class="item score"><span class="label">SCORE</span><span class="value" id="score">0</span></div>
      <div class="item"><span class="label">BEST</span><span class="value" id="best">0</span></div>
      <div class="icons"><button id="muteBtn" title="소리 (M)">🔊</button></div>
    </div>
    <div id="wrap">
      <div id="panel">
        <div id="rule"></div>
        <div id="card">
          <div id="combo"></div>
          <div id="word"></div>
          <div id="tbar"><i id="tfill"></i></div>
        </div>
        <div id="answers"></div>
        <div id="msg"></div>
      </div>
      <div id="banner"></div>
      <div id="overlay"></div>
    </div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
